services:
  - type: web
    name: instaframe-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health/ready
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "4000"

      - key: MONGO_URI
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: ADMIN_MFA_ENCRYPTION_KEY
        generateValue: true

      - key: ACCESS_TOKEN_TTL
        value: "15m"

      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"

      - key: COOKIE_SECURE
        value: "true"

      - key: CLIENT_URL
        sync: false

      - key: ADMIN_URL
        sync: false

      - key: MOBILE_APP_URL
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: CLOUDINARY_USAGE_CACHE_MS
        value: "300000"

      - key: OPERATIONS_ALERT_WEBHOOK_URL
        sync: false

      - key: OPERATIONS_ALERT_TOKEN
        sync: false

      - key: MEDIA_CLEANUP_ALERT_AFTER_ATTEMPTS
        value: "3"

      - key: STUN_SERVER
        value: "stun:stun.l.google.com:19302"

      - key: TURN_SERVER
        sync: false

      - key: TURN_USERNAME
        sync: false

      - key: TURN_PASSWORD
        sync: false

      - key: MIN_REEL_DURATION_SECONDS
        value: "2"

      - key: MAX_REEL_DURATION_SECONDS
        value: "90"

      - key: MAX_REEL_UPLOAD_MB
        value: "150"

      - key: MAX_REEL_CAPTION_LENGTH
        value: "2200"

      - key: MAX_REEL_HASHTAGS
        value: "20"

      - key: MAX_STORY_IMAGE_MB
        value: "15"

      - key: MAX_STORY_VIDEO_MB
        value: "75"

      - key: MAX_STORY_VIDEO_SECONDS
        value: "60"

      - key: STORY_EXPIRY_HOURS
        value: "24"

      - key: STORY_EXPIRY_JOB_INTERVAL_MS
        value: "60000"

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: EMAIL_DELIVERY_MODE
        value: "console"

      - key: EMAIL_FROM
        value: "no-reply@instaframe.local"

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_SECURE
        value: "false"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: DISCOVERY_RATE_LIMIT_PER_HOUR
        value: "10"

      - key: DISCOVERY_SCAN_MAX_UPLOAD_MB
        value: "5"

      - key: AI_PROVIDER_URL
        sync: false

      - key: AI_PROVIDER_API_KEY
        sync: false

      - key: AI_PROVIDER_MODEL
        sync: false

      - key: AI_PROVIDER_TIMEOUT_MS
        value: "10000"

      - key: AI_RATE_LIMIT_PER_HOUR
        value: "30"

      - key: MAX_UPLOAD_MB
        value: "25"

      - key: MAX_POST_VIDEO_MB
        value: "100"

      - key: MAX_POST_VIDEO_SECONDS
        value: "120"

      - key: MAX_CAROUSEL_ITEMS
        value: "10"

      - key: MAX_POST_HASHTAGS
        value: "20"

      - key: MAX_POST_CAPTION_LENGTH
        value: "2200"

      - key: MEDIA_SAFETY_ENFORCED
        value: "false"

      - key: MEDIA_CLEANUP_INTERVAL_MS
        value: "30000"

      - key: MEDIA_CLEANUP_MAX_ATTEMPTS
        value: "8"

      - key: PUSH_PROVIDER_URL
        sync: false

      - key: PUSH_PROVIDER_API_KEY
        sync: false

      - key: BILLING_VERIFICATION_URL
        sync: false

      - key: BILLING_VERIFICATION_SECRET
        sync: false

      - key: BILLING_WEBHOOK_SECRET
        sync: false

      - key: NOTIFICATION_RETENTION_DAYS
        value: "90"

      - key: OPERATIONS_JOB_INTERVAL_MS
        value: "3600000"

      - key: BOOTSTRAP_ADMIN_NAME
        sync: false

      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false

      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false