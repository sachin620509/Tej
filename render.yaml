services:
  - type: web
    name: instaframe-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health/ready
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DNS_SERVERS
        value: "8.8.8.8,1.1.1.1"
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_MFA_ENCRYPTION_KEY
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: "15m"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: MOBILE_APP_URL
        sync: false
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STUN_SERVER
        value: "stun:stun.l.google.com:19302"
      - key: TURN_SERVER
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false
      - key: DISCOVERY_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: DISCOVERY_SCAN_MAX_UPLOAD_MB
        value: "5"
      - key: AI_PROVIDER_URL
        sync: false
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "30"
      - key: MAX_POST_CAPTION_LENGTH
        value: "2200"
      - key: MAX_POST_HASHTAGS
        value: "20"
      - key: MAX_POST_VIDEO_SECONDS
        value: "120"
      - key: MAX_REEL_CAPTION_LENGTH
        value: "2200"
      - key: MAX_REEL_DURATION_SECONDS
        value: "90"
      - key: MAX_STORY_VIDEO_SECONDS
        value: "60"
      - key: STORY_EXPIRY_HOURS
        value: "24"
      - key: STORY_EXPIRY_JOB_INTERVAL_MS
        value: "60000"
      - key: MEDIA_SAFETY_ENFORCED
        value: "false"
      - key: MEDIA_CLEANUP_INTERVAL_MS
        value: "30000"
      - key: MEDIA_CLEANUP_MAX_ATTEMPTS
        value: "8"
      - key: MEDIA_CLEANUP_ALERT_AFTER_ATTEMPTS
        value: "3"
      - key: OPERATIONS_ALERT_WEBHOOK_URL
        sync: false
      - key: OPERATIONS_JOB_INTERVAL_MS
        value: "3600000"
      - key: PUSH_PROVIDER_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: EMAIL_DELIVERY_MODE
        value: "console"
      - key: EMAIL_FROM
        value: "no-reply@instaframe.local"
      - key: NOTIFICATION_RETENTION_DAYS
        value: "90"
      - key: BILLING_VERIFICATION_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
